
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "meta-ir"
version = "0.1.0"

description = "Meta-Introspective Reasoning for Adaptive Safety Alignment in Large Language Models"

readme = "README.md"

requires-python = ">=3.10"

license = {file = "LICENSE"}

keywords = [
    "large-language-models",
    "llm-safety",
    "safety-alignment",
    "trustworthy-ai",
    "meta-learning",
    "monte-carlo-tree-search",
    "jailbreak-robustness"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "datasets>=2.18.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "tqdm>=4.66.0",
    "safetensors>=0.4.2"
]


[project.optional-dependencies]

dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0"
]


[project.urls]

Homepage = "https://github.com/Miraj-Rahman-AI/Meta-IR"

Repository = "https://github.com/Miraj-Rahman-AI/Meta-IR"

Issues = "https://github.com/Miraj-Rahman-AI/Meta-IR/issues"


[tool.setuptools]

package-dir = {"" = "src"}


[tool.setuptools.packages.find]

where = ["src"]

include = ["meta_ir*"]


[tool.pytest.ini_options]

testpaths = ["tests"]

pythonpath = ["src"]


[tool.ruff]

line-length = 100

target-version = "py310"
