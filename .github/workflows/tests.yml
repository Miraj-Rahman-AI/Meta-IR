
name: META-IR Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Test Dependencies
        run: |
          python -m pip install pytest pyyaml

      - name: Run Unit Tests
        env:
          PYTHONPATH: src

        run: |
          python -m pytest tests/ -v

      - name: Report Test Results
        if: always()

        run: |
          echo "META-IR unit test workflow completed."
